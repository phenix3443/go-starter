# 生产环境配置
app:
  name: "go-starter"
  version: "1.0.0"
  environment: "production"
  debug: false

# 数据库配置（URL形式，使用环境变量）
mysql: "${MYSQL_DSN}"
postgres: "${POSTGRES_DSN}"

# Redis 配置
redis: "${REDIS_URL}"

# Kafka 配置（可选）
kafka:
  brokers:
    - "${KAFKA_BROKER_1}"
    - "${KAFKA_BROKER_2}"
  topic: "${KAFKA_TOPIC}"

# API 配置
api:
  version: "v1"
  address: ":8080"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 60

  # CORS 配置
  cors:
    allow_origin: "${ALLOWED_ORIGINS}"
    allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
    allow_headers: "Content-Type, Authorization"
    expose_headers: "Content-Length"
    max_age: 86400
    allow_credentials: false

  # 限流配置
  rate_limit:
    enabled: true
    max_requests: 100
    window_size: 60
    burst_size: 20

# 日志配置
log:
  level: "info"
  format: "json"
  output: "stdout"
